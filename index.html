<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace Lily AI Support - Command Center</title>
    <!-- Modern Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .transition-all-custom { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-slate-50 to-blue-50 min-h-screen text-gray-800">

    <!-- Top Navigation Bar -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-emerald-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 text-white rounded-2xl flex items-center justify-center font-bold text-lg shadow-md shadow-emerald-200">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-gray-900 tracking-tight flex items-center">
                        Peace Lily <span class="ml-2 text-xs px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full font-semibold">AI Support</span>
                    </h1>
                    <p class="text-xs text-gray-500">Autonomous Triage & Approval Hub</p>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <!-- Notification Bell -->
                <div class="relative">
                    <button class="w-10 h-10 bg-gray-50 border border-gray-200 rounded-full flex items-center justify-center text-gray-600 hover:bg-emerald-50 hover:text-emerald-600 transition-all-custom relative shadow-sm">
                        <i class="fa-solid fa-bell"></i>
                        <span id="notif-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm animate-pulse">0</span>
                    </button>
                </div>

                <!-- Admin Profile Selector -->
                <div class="flex items-center space-x-2 bg-white border border-gray-200 rounded-xl px-3.5 py-2 shadow-sm hover:border-emerald-300 transition-all-custom">
                    <div class="w-7 h-7 bg-emerald-100 text-emerald-700 rounded-lg flex items-center justify-center font-bold text-xs">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <select id="global-approver" class="bg-transparent text-sm font-semibold text-gray-700 outline-none cursor-pointer">
                        <option value="Manoj Aberathna">Manoj Aberathna (Lead AI)</option>
                        <option value="Admin Support Lead">Admin Support Lead</option>
                        <option value="QA Lead">QA Lead</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-between transition-all-custom hover:-translate-y-1 hover:shadow-md">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Pending Review</p>
                    <h3 id="stat-pending" class="text-3xl font-extrabold text-amber-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-clock-rotate-left"></i></div>
            </div>
            <div class="glass-card p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-between transition-all-custom hover:-translate-y-1 hover:shadow-md">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Approved & Sent</p>
                    <h3 id="stat-approved" class="text-3xl font-extrabold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-circle-check"></i></div>
            </div>
            <div class="glass-card p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-between transition-all-custom hover:-translate-y-1 hover:shadow-md">
                <div>
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Rejected Requests</p>
                    <h3 id="stat-rejected" class="text-3xl font-extrabold text-rose-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-ban"></i></div>
            </div>
        </div>

        <!-- Search Bar, Sentiment Filter & Tabs Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-gray-200 pb-4">
            <!-- Tabs Navigation -->
            <div class="flex space-x-3">
                <button onclick="switchTab('pending')" id="tab-pending" class="tab-btn px-5 py-2.5 font-bold text-sm rounded-xl bg-emerald-600 text-white transition-all-custom flex items-center space-x-2 shadow-sm">
                    <i class="fa-solid fa-inbox"></i><span>Pending Approvals</span>
                </button>
                <button onclick="switchTab('approved')" id="tab-approved" class="tab-btn px-5 py-2.5 font-bold text-sm rounded-xl bg-gray-200 text-gray-600 hover:bg-gray-300 transition-all-custom flex items-center space-x-2">
                    <i class="fa-solid fa-check-double"></i><span>Approved History</span>
                </button>
                <button onclick="switchTab('rejected')" id="tab-rejected" class="tab-btn px-5 py-2.5 font-bold text-sm rounded-xl bg-gray-200 text-gray-600 hover:bg-gray-300 transition-all-custom flex items-center space-x-2">
                    <i class="fa-solid fa-rectangle-xmark"></i><span>Rejected History</span>
                </button>
            </div>

            <!-- Sentiment Filter & Search Box -->
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <div class="flex items-center space-x-2 bg-white border border-gray-200 rounded-xl px-3 py-2 shadow-sm">
                    <i class="fa-solid fa-face-smile text-emerald-600 text-sm"></i>
                    <select id="sentiment-filter" onchange="renderCurrentTab()" class="bg-transparent text-sm font-semibold text-gray-700 outline-none cursor-pointer">
                        <option value="all">All Sentiments</option>
                        <option value="positive">Positive</option>
                        <option value="neutral">Neutral</option>
                        <option value="negative">Negative</option>
                    </select>
                </div>

                <div class="relative w-full md:w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="search-box" oninput="renderCurrentTab()" placeholder="Search by name, ID, order..." class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none shadow-sm">
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex items-center space-x-3 text-emerald-700 font-semibold p-6 glass-card rounded-2xl shadow-sm border border-emerald-100">
            <svg class="animate-spin h-5 w-5 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Synchronizing live data securely from Google Sheets...</span>
        </div>

        <!-- Main Content Cards Area -->
        <div id="requests-container" class="space-y-6"></div>

        <!-- Recent Activity Log (Last 5 Completed) -->
        <div class="mt-12 glass-card rounded-2xl shadow-sm border border-emerald-100 p-6">
            <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                <i class="fa-solid fa-timeline mr-2 text-emerald-600"></i> Recent Completed Actions (Last 5)
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-emerald-50/50 text-emerald-900 uppercase text-xs font-semibold">
                        <tr>
                            <th class="p-3.5 rounded-l-xl">Order ID</th>
                            <th class="p-3.5">Customer</th>
                            <th class="p-3.5">Status</th>
                            <th class="p-3.5">Action Date & Time</th>
                            <th class="p-3.5 rounded-r-xl">Approved By</th>
                        </tr>
                    </thead>
                    <tbody id="recent-activity-body" class="divide-y divide-gray-100">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhSGjRmtgVR6weLF4N31CQw5f0a1VPM7PJmMIzSawQt94Y-SFjgdtreNP8RhOLdwhorc5_qE1udneU/pub?gid=0&single=true&output=csv";
        const N8N_ACTION_WEBHOOK_URL = "https://peacelily.app.n8n.cloud/webhook/triage-message";

        let allRowsData = [];
        let currentActiveTab = 'pending';
        let processedMessageIds = []; // Local memory to instantly hide processed cards

        function fetchSheetData() {
            fetch(SHEET_CSV_URL + '&cb=' + new Date().getTime(), { cache: 'no-store' })
                .then(response => response.text())
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        transformHeader: h => h.trim(),
                        complete: function(results) {
                            document.getElementById('loading').style.display = 'none';
                            
                            // Normalize keys and sentiments to handle case differences & blank values robustly
                            allRowsData = results.data.map(row => {
                                const normalized = {};
                                Object.keys(row).forEach(key => {
                                    const cleanKey = key.trim();
                                    normalized[cleanKey] = row[key];
                                    if(cleanKey.toLowerCase() === 'sentiment') {
                                        normalized['sentiment'] = row[key] ? row[key].trim().toLowerCase() : 'neutral';
                                    }
                                    if(cleanKey.toLowerCase() === 'status') {
                                        normalized['status'] = row[key] ? row[key].trim().toLowerCase() : 'awaiting_approval';
                                    }
                                });
                                if(!normalized['sentiment']) normalized['sentiment'] = 'neutral';
                                if(!normalized['status']) normalized['status'] = 'awaiting_approval';
                                return normalized;
                            });

                            updateDashboardCounts();
                            renderCurrentTab();
                            renderRecentActivity();
                        }
                    });
                })
                .catch(err => {
                    document.getElementById('loading').innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-xl border border-rose-200">Error connecting to sheet: ${err}</div>`;
                });
        }

        function updateDashboardCounts() {
            const pending = allRowsData.filter(r => {
                const status = (r.status || '').trim().toLowerCase();
                return (status === 'awaiting_approval' || status === '') && !processedMessageIds.includes(r['Message ID']);
            }).length;

            const approved = allRowsData.filter(r => (r.status || '').trim().toLowerCase() === 'approved').length;
            const rejected = allRowsData.filter(r => (r.status || '').trim().toLowerCase() === 'rejected').length;

            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-approved').innerText = approved;
            document.getElementById('stat-rejected').innerText = rejected;
            document.getElementById('notif-badge').innerText = pending;
        }

        function switchTab(tabName) {
            currentActiveTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-gray-200', 'text-gray-600');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('bg-gray-200', 'text-gray-600');
            activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-sm');
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const container = document.getElementById('requests-container');
            container.innerHTML = '';

            const searchQuery = document.getElementById('search-box').value.toLowerCase();
            const sentimentFilter = document.getElementById('sentiment-filter').value.toLowerCase();

            let filtered = [];
            if (currentActiveTab === 'pending') {
                filtered = allRowsData.filter(r => {
                    const status = (r.status || '').trim().toLowerCase();
                    return (status === 'awaiting_approval' || status === '') && !processedMessageIds.includes(r['Message ID']);
                });
            } else if (currentActiveTab === 'approved') {
                filtered = allRowsData.filter(r => (r.status || '').trim().toLowerCase() === 'approved');
            } else if (currentActiveTab === 'rejected') {
                filtered = allRowsData.filter(r => (r.status || '').trim().toLowerCase() === 'rejected');
            }

            // Sentiment Filtering
            if (sentimentFilter !== 'all') {
                filtered = filtered.filter(r => {
                    let sent = (r['sentiment'] || 'neutral').trim().toLowerCase();
                    return sent === sentimentFilter;
                });
            }

            if (searchQuery.trim() !== '') {
                filtered = filtered.filter(r => {
                    const name = (r['Customer Name'] || '').toLowerCase();
                    const order = (r['Order Number'] || '').toLowerCase();
                    const msgId = (r['Message ID'] || '').toLowerCase();
                    const email = (r['Customer Email'] || '').toLowerCase();
                    return name.includes(searchQuery) || order.includes(searchQuery) || msgId.includes(searchQuery) || email.includes(searchQuery);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-10 glass-card rounded-2xl shadow-sm border border-emerald-100 text-center text-gray-500 font-medium">🎉 No records found matching your filter criteria.</div>`;
                return;
            }

            filtered.forEach(row => {
                if (!row['Order Number']) return;
                const card = document.createElement('div');
                card.className = "glass-card p-6 rounded-2xl shadow-sm border border-emerald-100 transition-all-custom hover:shadow-md";
                
                const messageId = row['Message ID'] || '';
                const customerEmail = row['Customer Email'] || '';
                const draftReply = row['Draft Reply'] || '';
                const status = row['status'] ? row['status'].trim().toLowerCase() : 'awaiting_approval';
                
                // Sentiment Badge styling
                const sentimentVal = (row['sentiment'] || 'neutral').toUpperCase();
                let sentimentColor = 'bg-blue-50 text-blue-700 border-blue-200';
                if(sentimentVal === 'POSITIVE') sentimentColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                if(sentimentVal === 'NEGATIVE') sentimentColor = 'bg-rose-50 text-rose-700 border-rose-200';

                let badgeColor = 'bg-amber-50 text-amber-800 border-amber-200';
                if(status === 'approved') badgeColor = 'bg-emerald-50 text-emerald-800 border-emerald-200';
                if(status === 'rejected') badgeColor = 'bg-rose-50 text-rose-800 border-rose-200';

                let actionSection = '';
                if(status === 'awaiting_approval' || status === '') {
                    actionSection = `
                        <div class="mt-5 pt-4 border-t border-gray-100 flex space-x-3">
                            <button class="approve-btn bg-emerald-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-emerald-700 shadow-sm transition-all-custom flex items-center space-x-2 transform active:scale-95">
                                <i class="fa-solid fa-check"></i><span>Approve & Send</span>
                            </button>
                            <button class="reject-btn bg-rose-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-rose-700 shadow-sm transition-all-custom flex items-center space-x-2 transform active:scale-95">
                                <i class="fa-solid fa-xmark"></i><span>Reject</span>
                            </button>
                        </div>
                    `;
                } else {
                    actionSection = `
                        <div class="mt-4 pt-3 border-t border-gray-100 text-xs text-gray-500 flex justify-between">
                            <span>Action Date: <strong>${row['action_date'] || '-'} ${row['action_time'] || ''}</strong></span>
                            <span>Processed by: <strong>${row['approved_by'] || '-'}</strong></span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-base font-extrabold text-gray-800 flex items-center">
                            <i class="fa-solid fa-box text-emerald-600 mr-2"></i> Order ID: <span class="text-emerald-700 ml-1">${row['Order Number']}</span> <span class="text-gray-400 mx-2">|</span> Customer: ${row['Customer Name']}
                        </h3>
                        <span class="px-3 py-1 text-xs font-bold rounded-full border ${badgeColor}">${status ? status.toUpperCase() : 'AWAITING_APPROVAL'}</span>
                    </div>
                    <p class="text-xs text-gray-500 mb-3 font-medium">
                        <strong>Email:</strong> ${customerEmail} <span class="text-gray-300 mx-1">|</span> 
                        <strong>Category:</strong> ${row['Category']} <span class="text-gray-300 mx-1">|</span> 
                        <strong>Urgency:</strong> <span class="uppercase">${row['Urgency'] || 'Low'}</span> <span class="text-gray-300 mx-1">|</span> 
                        <strong>Sentiment:</strong> <span class="px-2 py-0.5 text-[10px] font-bold rounded-md border ${sentimentColor}">${sentimentVal}</span>
                    </p>
                    <div class="bg-gray-50/80 p-3.5 rounded-xl border border-gray-100 mb-3 text-sm text-gray-700"><strong>Summary:</strong> ${row['Summary']}</div>
                    <div class="bg-emerald-50/50 p-3.5 rounded-xl border border-emerald-100/60 text-sm text-emerald-950"><strong>AI Draft Reply:</strong><br>${draftReply}</div>
                    ${actionSection}
                `;

                if(status === 'awaiting_approval' || status === '') {
                    const approveBtn = card.querySelector('.approve-btn');
                    approveBtn.addEventListener('click', () => {
                        const selectedApprover = document.getElementById('global-approver').value;
                        sendAction(messageId, customerEmail, draftReply, 'approved', selectedApprover);
                    });

                    const rejectBtn = card.querySelector('.reject-btn');
                    rejectBtn.addEventListener('click', () => {
                        const selectedApprover = document.getElementById('global-approver').value;
                        sendAction(messageId, '', '', 'rejected', selectedApprover);
                    });
                }

                container.appendChild(card);
            });
        }

        function renderRecentActivity() {
            const tbody = document.getElementById('recent-activity-body');
            tbody.innerHTML = '';

            const completed = allRowsData.filter(r => r.status && (r.status.trim().toLowerCase() === 'approved' || r.status.trim().toLowerCase() === 'rejected'));
            const last5 = completed.reverse().slice(0, 5);

            if(last5.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No completed actions recorded yet.</td></tr>`;
                return;
            }

            last5.forEach(row => {
                const status = row['status'].trim().toLowerCase();
                const badge = status === 'approved' ? '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-[10px] font-extrabold rounded-md">APPROVED</span>' : '<span class="px-2.5 py-1 bg-rose-100 text-rose-800 text-[10px] font-extrabold rounded-md">REJECTED</span>';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-emerald-50/30 transition-all-custom";
                tr.innerHTML = `
                    <td class="p-3.5 font-semibold text-emerald-700">${row['Order Number'] || '-'}</td>
                    <td class="p-3.5 text-gray-700 font-medium">${row['Customer Name'] || '-'}</td>
                    <td class="p-3.5">${badge}</td>
                    <td class="p-3.5 text-gray-500 text-xs">${row['action_date'] || ''} ${row['action_time'] || ''}</td>
                    <td class="p-3.5 font-medium text-gray-700 text-xs">${row['approved_by'] || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sendAction(messageId, email, reply, actionType, approverName) {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().split(' ')[0];

            const payload = {
                message_id: messageId,
                customer_email: email,
                draft_reply: reply,
                action: actionType,
                action_date: dateStr,
                action_time: timeStr,
                approver_name: approverName
            };

            fetch(N8N_ACTION_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if(res.ok) {
                    if (!processedMessageIds.includes(messageId)) {
                        processedMessageIds.push(messageId); // Instantly hide locally
                    }
                    alert(`Action (${actionType}) successfully recorded, email dispatched & sheet synchronized!`);
                    fetchSheetData(); 
                } else {
                    alert('Webhook trigger failed.');
                }
            })
            .catch(err => alert('Error: ' + err));
        }

        fetchSheetData();
        // Auto poll every 6 seconds for smooth near real-time sync
        setInterval(fetchSheetData, 6000);
    </script>
</body>
</html>
