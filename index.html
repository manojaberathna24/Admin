<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace Lily Support - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <div class="flex items-center justify-between mb-6 border-b pb-4">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">🛡️ Peace Lily AI Support</h1>
                <p class="text-sm text-gray-500 mt-1">Admin Approval & Triage Command Center</p>
            </div>
            <span class="px-3 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-full border border-blue-200">Live Sync Active</span>
        </div>

        <div id="loading" class="flex items-center space-x-3 text-blue-600 font-semibold p-4 bg-blue-50 rounded-lg">
            <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Loading pending customer requests...</span>
        </div>
        
        <div id="requests-container" class="space-y-6"></div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhSGjRmtgVR6weLF4N31CQw5f0a1VPM7PJmMIzSawQt94Y-SFjgdtreNP8RhOLdwhorc5_qE1udneU/pub?gid=0&single=true&output=csv";
        const N8N_ACTION_WEBHOOK_URL = "https://peacelily.app.n8n.cloud/webhook/triage-message";

        fetch(SHEET_CSV_URL)
            .then(response => response.text())
            .then(csvText => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: function(header) {
                        return header.trim();
                    },
                    complete: function(results) {
                        document.getElementById('loading').style.display = 'none';
                        const data = results.data;
                        const container = document.getElementById('requests-container');
                        
                        const pendingRows = data.filter(row => row.status && row.status.trim() === 'awaiting_approval');

                        if (pendingRows.length === 0) {
                            container.innerHTML = `<div class="p-6 bg-green-50 text-green-700 rounded-xl border border-green-200 font-medium text-center">🎉 No pending requests to review! All caught up.</div>`;
                            return;
                        }

                        pendingRows.forEach(row => {
                            if (!row['Order Number']) return;
                            
                            const card = document.createElement('div');
                            card.className = "border border-gray-200 p-6 rounded-xl bg-white shadow-sm hover:shadow-md transition-shadow duration-200";
                            card.innerHTML = `
                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="text-base font-bold text-gray-800">📦 Order ID: <span class="text-blue-600">${row['Order Number']}</span> | Customer: ${row['Customer Name']}</h3>
                                    <span class="px-3 py-1 bg-amber-50 text-amber-800 text-xs font-bold rounded-full border border-amber-200">Urgency: ${row['Urgency']}</span>
                                </div>
                                <p class="text-xs text-gray-500 mb-3"><strong>Email:</strong> ${row['Customer Email']} | <strong>Category:</strong> ${row['Category']} | <strong>Message ID:</strong> ${row['Message ID']}</p>
                                <div class="bg-gray-50 p-3.5 rounded-lg border border-gray-100 mb-3 text-sm text-gray-700"><strong>Summary:</strong> ${row['Summary']}</div>
                                <div class="bg-blue-50/60 p-3.5 rounded-lg border border-blue-100 mb-5 text-sm text-blue-900"><strong>AI Draft Reply:</strong><br>${row['Draft Reply']}</div>
                                <div class="flex space-x-3">
                                    <button onclick="sendAction('${row['Message ID']}', '${row['Customer Email']}', '${row['Draft Reply']}', 'approved')" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-700 shadow-sm transition-colors flex items-center space-x-2"><span>✅ Approve & Send</span></button>
                                    <button onclick="sendAction('${row['Message ID']}', '', '', 'rejected')" class="bg-rose-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-rose-700 shadow-sm transition-colors flex items-center space-x-2"><span>❌ Reject</span></button>
                                </div>
                            `;
                            container.appendChild(card);
                        });
                    }
                });
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-xl border border-rose-200">Error loading data: ${err}</div>`;
            });

        function sendAction(messageId, email, reply, actionType) {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0]; // YYYY-MM-DD
            const timeStr = now.toTimeString().split(' ')[0]; // HH:MM:SS

            const payload = {
                message_id: messageId,
                customer_email: email,
                draft_reply: reply,
                action: actionType,
                action_date: dateStr,
                action_time: timeStr,
                approver_name: "Manoj Aberathna"
            };

            fetch(N8N_ACTION_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if(res.ok) {
                    alert(`Action (${actionType}) successfully recorded!`);
                    location.reload();
                } else {
                    alert('Webhook trigger failed.');
                }
            })
            .catch(err => alert('Error: ' + err));
        }
    </script>
</body>
</html>
